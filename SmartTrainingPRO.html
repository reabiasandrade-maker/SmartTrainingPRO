<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Training PRO</title>
  <style>
    :root{
      --bg:#0b1020;
      --panel:rgba(255,255,255,.08);
      --panel-strong:rgba(255,255,255,.12);
      --border:rgba(255,255,255,.12);
      --text:#eef2ff;
      --muted:#a5b4fc;
      --accent:#7c3aed;
      --accent-2:#22c55e;
      --danger:#ef4444;
      --warning:#f59e0b;
      --shadow:0 20px 50px rgba(0,0,0,.35);
      --radius:22px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124,58,237,.28), transparent 28%),
        radial-gradient(circle at top right, rgba(34,197,94,.18), transparent 24%),
        linear-gradient(180deg,#0b1020 0%, #111827 100%);
      color:var(--text);
      min-height:100vh;
    }

    .container{
      max-width:1200px;
      margin:0 auto;
      padding:28px 18px 48px;
    }

    .hero{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:24px;
      flex-wrap:wrap;
    }

    .brand h1{
      margin:0;
      font-size:2rem;
      letter-spacing:.3px;
    }

    .brand p{
      margin:6px 0 0;
      color:#c7d2fe;
      opacity:.9;
    }

    .status-chip{
      background:var(--panel);
      border:1px solid var(--border);
      padding:12px 16px;
      border-radius:999px;
      backdrop-filter: blur(14px);
      box-shadow:var(--shadow);
      font-size:.95rem;
    }

    .grid{
      display:grid;
      grid-template-columns: 340px 1fr;
      gap:18px;
    }

    .card{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:20px;
      backdrop-filter: blur(18px);
      box-shadow:var(--shadow);
    }

    .card h2{
      margin:0 0 16px;
      font-size:1.1rem;
    }

    .stack{display:flex; flex-direction:column; gap:12px;}
    .row{display:flex; gap:12px; flex-wrap:wrap;}
    .row > *{flex:1}

    label{
      display:block;
      font-size:.92rem;
      margin-bottom:6px;
      color:#dbeafe;
    }

    input, select, textarea{
      width:100%;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.07);
      color:var(--text);
      outline:none;
      font-size:.96rem;
    }

    input::placeholder, textarea::placeholder{color:#cbd5e1}

    button{
      border:none;
      border-radius:14px;
      padding:12px 16px;
      font-weight:700;
      cursor:pointer;
      transition:.2s ease;
    }

    button:hover{transform:translateY(-1px)}
    .btn-primary{
      background:linear-gradient(135deg,var(--accent),#4f46e5);
      color:white;
    }
    .btn-success{
      background:linear-gradient(135deg,var(--accent-2),#16a34a);
      color:white;
    }
    .btn-ghost{
      background:rgba(255,255,255,.08);
      color:var(--text);
      border:1px solid rgba(255,255,255,.10);
    }
    .btn-danger{
      background:linear-gradient(135deg,var(--danger),#dc2626);
      color:#fff;
    }

    .athlete-list{
      display:flex;
      flex-direction:column;
      gap:10px;
      max-height:360px;
      overflow:auto;
      padding-right:4px;
    }

    .athlete-item{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.05);
      border-radius:16px;
      padding:12px 14px;
      cursor:pointer;
    }

    .athlete-item.active{
      outline:2px solid rgba(124,58,237,.65);
      background:rgba(124,58,237,.18);
    }

    .athlete-item strong{
      display:block;
      margin-bottom:4px;
    }

    .metrics{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:12px;
      margin-top:12px;
    }

    .metric{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      border-radius:18px;
      padding:14px;
    }

    .metric .label{
      font-size:.82rem;
      color:#cbd5e1;
      margin-bottom:6px;
    }

    .metric .value{
      font-size:1.25rem;
      font-weight:800;
    }

    .table-wrap{
      margin-top:16px;
      overflow:auto;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.10);
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:760px;
      background:rgba(255,255,255,.04);
    }

    th, td{
      padding:12px 14px;
      border-bottom:1px solid rgba(255,255,255,.08);
      text-align:left;
      font-size:.93rem;
    }

    th{
      background:rgba(255,255,255,.06);
      color:#dbeafe;
    }

    .small{
      color:#cbd5e1;
      font-size:.88rem;
    }

    .log{
      margin-top:12px;
      min-height:44px;
      padding:12px 14px;
      border-radius:14px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color:#e2e8f0;
      white-space:pre-wrap;
    }

    @media (max-width: 960px){
      .grid{grid-template-columns:1fr}
      .metrics{grid-template-columns:repeat(2,1fr)}
    }

    @media (max-width: 640px){
      .metrics{grid-template-columns:1fr}
      .hero{align-items:flex-start}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="brand">
        <h1>Smart Training PRO</h1>
        <p>Bluetooth + atletas cadastrados + Google Sheets</p>
      </div>
      <div class="status-chip" id="bluetoothStatus">Bluetooth: verificando...</div>
    </div>

    <div class="grid">
      <aside class="card">
        <h2>Cadastro de atletas</h2>
        <div class="stack">
          <div>
            <label>Nome</label>
            <input id="athleteName" placeholder="Ex.: João Silva" />
          </div>
          <div class="row">
            <div>
              <label>Modalidade</label>
              <input id="athleteSport" placeholder="Ex.: Judô" />
            </div>
            <div>
              <label>Categoria</label>
              <input id="athleteCategory" placeholder="Ex.: -81 kg" />
            </div>
          </div>
          <div class="row">
            <div>
              <label>Data de nascimento</label>
              <input id="athleteBirth" type="date" />
            </div>
            <div>
              <label>ID interno</label>
              <input id="athleteCode" placeholder="Ex.: ATL-001" />
            </div>
          </div>
          <button class="btn-primary" id="saveAthleteBtn">Salvar atleta</button>
        </div>

        <hr style="border-color:rgba(255,255,255,.08); margin:20px 0;">

        <div class="row" style="align-items:end;">
          <div style="flex:1.3">
            <label>Atletas cadastrados</label>
          </div>
          <div style="flex:.7">
            <button class="btn-ghost" id="refreshAthletesBtn">Atualizar</button>
          </div>
        </div>

        <div class="athlete-list" id="athleteList"></div>
      </aside>

      <main class="card">
        <h2>Painel do atleta</h2>

        <div class="row">
          <div>
            <label>Atleta selecionado</label>
            <select id="selectedAthlete"></select>
          </div>
          <div>
            <label>Tipo de coleta</label>
            <select id="measurementType">
              <option value="HRV">HRV</option>
              <option value="FC">Frequência Cardíaca</option>
              <option value="Peso">Peso</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
        </div>

        <div class="row" style="margin-top:12px;">
          <button class="btn-success" id="connectBtn">Conectar Bluetooth</button>
          <button class="btn-primary" id="readBtn">Ler dado do dispositivo</button>
          <button class="btn-ghost" id="historyBtn">Carregar histórico</button>
        </div>

        <div class="metrics">
          <div class="metric">
            <div class="label">Dispositivo</div>
            <div class="value" id="deviceName">—</div>
          </div>
          <div class="metric">
            <div class="label">Último valor</div>
            <div class="value" id="lastValue">—</div>
          </div>
          <div class="metric">
            <div class="label">Tipo</div>
            <div class="value" id="lastType">—</div>
          </div>
          <div class="metric">
            <div class="label">Status</div>
            <div class="value" id="deviceState">Desconectado</div>
          </div>
        </div>

        <div style="margin-top:16px;">
          <label>Observação</label>
          <textarea id="notes" rows="3" placeholder="Observações da coleta"></textarea>
        </div>

        <div class="log" id="logBox">Sistema iniciado.</div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Data/Hora</th>
                <th>Atleta</th>
                <th>Tipo</th>
                <th>Valor</th>
                <th>Dispositivo</th>
                <th>Observação</th>
              </tr>
            </thead>
            <tbody id="historyTable">
              <tr><td colspan="6" class="small">Nenhum dado carregado.</td></tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzyK7cYt1lz8wPspuj4-l1gg546o67Zj8cxDKnMkNUVKOmunu7pNWXEuYGhC9UtJdCQ/exec";

    let bluetoothDevice = null;
    let gattServer = null;
    let selectedCharacteristic = null;

    // UUIDs de exemplo.
    // Você vai trocar conforme o seu equipamento real.
    const BLE_CONFIG = {
      serviceUuid: "heart_rate",
      characteristicUuid: "heart_rate_measurement"
    };

    const el = (id) => document.getElementById(id);

    function log(msg) {
      el("logBox").textContent = `[${new Date().toLocaleString("pt-BR")}] ${msg}`;
    }

    function setBluetoothStatus(msg) {
      el("bluetoothStatus").textContent = `Bluetooth: ${msg}`;
    }

    async function checkBluetoothAvailability() {
      if (!("bluetooth" in navigator)) {
        setBluetoothStatus("não suportado neste navegador");
        return;
      }

      try {
        const available = await navigator.bluetooth.getAvailability();
        setBluetoothStatus(available ? "disponível" : "indisponível no dispositivo");
      } catch (error) {
        setBluetoothStatus("não foi possível verificar");
      }
    }

    async function apiGet(params = {}) {
      const url = new URL(API_URL);
      Object.entries(params).forEach(([k, v]) => url.searchParams.append(k, v));

      const response = await fetch(url.toString(), {
        method: "GET"
      });
      return response.json();
    }

    async function apiPost(payload = {}) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      });
      return response.json();
    }

    async function loadAthletes() {
      try {
        const data = await apiGet({ action: "listAthletes" });
        const athletes = data.athletes || [];

        const list = el("athleteList");
        const select = el("selectedAthlete");

        list.innerHTML = "";
        select.innerHTML = `<option value="">Selecione</option>`;

        if (!athletes.length) {
          list.innerHTML = `<div class="small">Nenhum atleta cadastrado.</div>`;
          return;
        }

        athletes.forEach((athlete) => {
          const item = document.createElement("div");
          item.className = "athlete-item";
          item.dataset.id = athlete.id;
          item.innerHTML = `
            <strong>${athlete.name}</strong>
            <div class="small">${athlete.sport || "Sem modalidade"} • ${athlete.category || "Sem categoria"}</div>
            <div class="small">${athlete.code || "Sem código"}</div>
          `;
          item.addEventListener("click", () => {
            document.querySelectorAll(".athlete-item").forEach(x => x.classList.remove("active"));
            item.classList.add("active");
            select.value = athlete.id;
          });
          list.appendChild(item);

          const option = document.createElement("option");
          option.value = athlete.id;
          option.textContent = athlete.name;
          select.appendChild(option);
        });

        log("Atletas carregados com sucesso.");
      } catch (error) {
        log("Erro ao carregar atletas: " + error.message);
      }
    }

    async function saveAthlete() {
      const payload = {
        action: "saveAthlete",
        name: el("athleteName").value.trim(),
        sport: el("athleteSport").value.trim(),
        category: el("athleteCategory").value.trim(),
        birthDate: el("athleteBirth").value,
        code: el("athleteCode").value.trim()
      };

      if (!payload.name) {
        log("Informe o nome do atleta.");
        return;
      }

      try {
        const res = await apiPost(payload);
        if (res.success) {
          log("Atleta salvo com sucesso.");
          el("athleteName").value = "";
          el("athleteSport").value = "";
          el("athleteCategory").value = "";
          el("athleteBirth").value = "";
          el("athleteCode").value = "";
          loadAthletes();
        } else {
          log("Falha ao salvar atleta.");
        }
      } catch (error) {
        log("Erro ao salvar atleta: " + error.message);
      }
    }

    async function connectBluetooth() {
      if (!navigator.bluetooth) {
        log("Web Bluetooth não está disponível neste navegador.");
        return;
      }

      try {
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ services: [BLE_CONFIG.serviceUuid] }],
          optionalServices: [BLE_CONFIG.serviceUuid]
        });

        bluetoothDevice.addEventListener("gattserverdisconnected", () => {
          el("deviceState").textContent = "Desconectado";
          log("Dispositivo desconectado.");
        });

        gattServer = await bluetoothDevice.gatt.connect();
        const service = await gattServer.getPrimaryService(BLE_CONFIG.serviceUuid);
        selectedCharacteristic = await service.getCharacteristic(BLE_CONFIG.characteristicUuid);

        el("deviceName").textContent = bluetoothDevice.name || "Sem nome";
        el("deviceState").textContent = "Conectado";
        log("Bluetooth conectado com sucesso.");
      } catch (error) {
        log("Erro ao conectar Bluetooth: " + error.message);
      }
    }

    function parseBluetoothValue(dataView, measurementType) {
      // Exemplo genérico:
      // - heart_rate_measurement costuma ter flags no byte 0 e valor em byte 1
      // Ajuste conforme o dispositivo real.
      try {
        if (measurementType === "FC" || measurementType === "HRV") {
          if (dataView.byteLength >= 2) {
            return dataView.getUint8(1);
          }
        }
        if (dataView.byteLength >= 2) {
          return dataView.getUint16(0, true);
        }
        if (dataView.byteLength >= 1) {
          return dataView.getUint8(0);
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    async function readBluetoothData() {
      const athleteId = el("selectedAthlete").value;
      const measurementType = el("measurementType").value;
      const notes = el("notes").value.trim();

      if (!athleteId) {
        log("Selecione um atleta.");
        return;
      }

      if (!selectedCharacteristic) {
        log("Conecte primeiro ao dispositivo Bluetooth.");
        return;
      }

      try {
        const value = await selectedCharacteristic.readValue();
        const parsedValue = parseBluetoothValue(value, measurementType);

        el("lastValue").textContent = parsedValue ?? "—";
        el("lastType").textContent = measurementType;

        const payload = {
          action: "saveMeasurement",
          athleteId,
          measurementType,
          measurementValue: parsedValue,
          deviceName: bluetoothDevice?.name || "",
          notes,
          rawHex: Array.from(new Uint8Array(value.buffer))
            .map(b => b.toString(16).padStart(2, "0"))
            .join(" ")
        };

        const res = await apiPost(payload);

        if (res.success) {
          log("Dado lido e salvo com sucesso.");
          loadHistory();
        } else {
          log("Dado lido, mas houve falha ao salvar.");
        }
      } catch (error) {
        log("Erro ao ler dado Bluetooth: " + error.message);
      }
    }

    async function loadHistory() {
      const athleteId = el("selectedAthlete").value;

      if (!athleteId) {
        log("Selecione um atleta para ver o histórico.");
        return;
      }

      try {
        const data = await apiGet({
          action: "listMeasurements",
          athleteId
        });

        const rows = data.measurements || [];
        const tbody = el("historyTable");
        tbody.innerHTML = "";

        if (!rows.length) {
          tbody.innerHTML = `<tr><td colspan="6" class="small">Nenhum registro encontrado.</td></tr>`;
          return;
        }

        rows.forEach((row) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.timestamp || ""}</td>
            <td>${row.athleteName || ""}</td>
            <td>${row.measurementType || ""}</td>
            <td>${row.measurementValue ?? ""}</td>
            <td>${row.deviceName || ""}</td>
            <td>${row.notes || ""}</td>
          `;
          tbody.appendChild(tr);
        });

        log("Histórico carregado.");
      } catch (error) {
        log("Erro ao carregar histórico: " + error.message);
      }
    }

    el("saveAthleteBtn").addEventListener("click", saveAthlete);
    el("refreshAthletesBtn").addEventListener("click", loadAthletes);
    el("connectBtn").addEventListener("click", connectBluetooth);
    el("readBtn").addEventListener("click", readBluetoothData);
    el("historyBtn").addEventListener("click", loadHistory);

    checkBluetoothAvailability();
    loadAthletes();
  </script>
</body>
</html>
